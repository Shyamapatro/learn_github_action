name: Test Secrets and Variables

on: [push]

jobs:
  test-secrets-job:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Using a Variable (vars)
      - name: Print the Variable
        env:
          MY_PUBLIC_VAR: ${{ vars.MY_PUBLIC_VAR }}
        run: |
          # Variables are safe to print, so you will see this in the logs.
          echo "The variable says: $MY_PUBLIC_VAR"

      # Step 2: Using a Secret (secrets)
      - name: Try to print the Secret
        env:
          MY_SUPER_SECRET: ${{ secrets.MY_SUPER_SECRET }}
        run: |
          # GitHub Actions detects if a secret is about to be printed to the logs.
          # It will automatically intercept it and replace it with ***
          echo "The secret is: $MY_SUPER_SECRET"

      # Step 3: A secure way to check if a secret loaded correctly
      - name: Secure Secret Check
        env:
          MY_SUPER_SECRET: ${{ secrets.MY_SUPER_SECRET }}
        run: |
          if [ -n "$MY_SUPER_SECRET" ]; then
            echo "✅ Success! The secret was securely loaded into the environment."
            echo "We can now pass it to an API or database."
          else
            echo "❌ Failed to load the secret."
          fi
